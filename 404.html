<head>
  <meta charset="utf-8">
  <title>أحمد الفرجاني — خبير هندسة برمجيات</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fa">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!--
    Runs before first paint:
    theme             → saved choice, else the system setting, else light
    ?lang=ar|en       → the same page under / (Arabic) or /en/ (English)
    no ?lang          → /en/… stays English; elsewhere the earlier choice, else Arabic
    /apps/#<key>      → /apps/<key>/  (the old catalogue linked apps by hash)
    ?accent=blue      → preview another accent colour (DESIGN.md)
  -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');

      var theme = null;
      try { theme = localStorage.getItem('saqr-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      d.setAttribute('data-theme', theme);

      var l = location, path = l.pathname, q = l.search, h = l.hash.slice(1);
      var m = q.match(/[?&]lang=(ar|en)/), want = m && m[1], saved = null;
      try { saved = localStorage.getItem('saqr-lang'); } catch (e) {}
      if (want) { try { localStorage.setItem('saqr-lang', want); } catch (e) {} }
      var isEn = /^\/en(\/|$)/.test(path);
      var lang = want || (isEn ? 'en' : (saved === 'en' ? 'en' : 'ar'));
      var base = isEn ? path.replace(/^\/en/, '') || '/' : path;
      if (h && /^\/(apps|games)\/?$/.test(base) && /^[a-z0-9-]+$/.test(h)) { base = base.replace(/\/?$/, '/') + h + '/'; h = ''; }
      var to = (lang === 'en' ? '/en' + (base === '/' ? '/' : base) : base) + (h ? '#' + h : '');
      var a = q.match(/[?&]accent=(amber|blue|teal|violet)/);
      if (a) d.setAttribute('data-accent', a[1]);
      var keep = a ? '?accent=' + a[1] : '';
      if (to !== path + (h ? '#' + h : '') || want) l.replace(to + keep);
    })();
  </script>
